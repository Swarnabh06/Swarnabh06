name: Metrics

on:
  # Refresh once a day (00:30 IST), on demand, and whenever this repo changes
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["metrics.svg"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic personal access token stored as a repo secret (no scopes needed for public data)
          token: ${{ secrets.METRICS_TOKEN }}
          user: Swarnabh06
          filename: metrics.svg
          committer_message: "chore: update metrics"

          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Kolkata
          config_twemoji: yes

          # 3D contributions calendar + streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Note: the "habits" plugin and the "recently-used" languages section are left out on purpose.
          # Both read commit lists from GitHub push events, which GitHub no longer includes, so they error out.
          # The README shows a contribution activity graph instead.

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage

          # "Mastered technologies" icon grid (comes from topics you star at github.com/topics)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 20

          # "achievements" is also left out: it queries Projects (classic), which GitHub has retired.
